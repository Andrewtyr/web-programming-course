# Дополнительный файл для переопределения без дублирования основного compose.
# Подключение: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Назначение: примонтировать ./src в контейнер только для чтения — правки в IDE сразу видны процессу
# (удобно отлаживать без пересборки образа). Нужен образ с dev-зависимостями или запуск через tsx внутри контейнера;
# для production-образа из Dockerfile в dist это используется реже.

services:
  backend:
    volumes:
      - ./src:/app/src:ro
